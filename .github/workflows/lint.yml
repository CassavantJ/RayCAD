# Lint: include rules, CMake dependency graph, dmath rule, colour-literal rule, licence ledger, clang-format.
# Each lint is also run with --self-test, which proves it still catches a planted violation.
# Needs no secret. Actions are pinned to commit SHAs; the comment gives the release tag.
name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Include rules (PLAN.md 0.4 rule 1, 1.1)
        run: python tools/lint_includes.py && python tools/lint_includes.py --self-test

      - name: CMake dependency graph (PLAN.md 0.4 rule 2, 1.1)
        run: python tools/lint_cmake_deps.py && python tools/lint_cmake_deps.py --self-test

      - name: dmath rule (PLAN.md 8)
        run: python tools/lint_dmath.py && python tools/lint_dmath.py --self-test

      - name: Colour-literal rule (PLAN.md 0.4 rule 6)
        run: python tools/lint_colours.py && python tools/lint_colours.py --self-test

      # The direct dependencies in vcpkg.json. The build-test jobs repeat this check against everything
      # vcpkg really installed (transitive ports), through the CTest test lint_licences_installed.
      - name: Licence ledger (PLAN.md 2.4)
        run: python tools/lint_licences.py && python tools/lint_licences.py --self-test

      - name: clang-format
        run: |
          python -m pip install --disable-pip-version-check clang-format==22.1.3
          python tools/check_format.py
