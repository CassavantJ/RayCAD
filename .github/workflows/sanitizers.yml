# AddressSanitizer and UndefinedBehaviorSanitizer on Linux (Clang), preset linux-clang-asan.
# The vcpkg libraries and Qt are not instrumented; RayCAD's own code and the tests are. Every test runs (both tiers,
# in parallel) except the few labelled sanitizer-heavy (tests/tiers.cmake), which Release runs. The preset builds without precompiled headers (RAY_PCH=OFF), so this job is also the one that proves
# every source includes what it uses.
# Needs no secret. Actions are pinned to commit SHAs; the comment gives the release tag.
name: sanitizers

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.ref }}
  # A run on main is allowed to finish so it can fill the dependency cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: "6.12.0"

jobs:
  asan-ubsan:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang ninja-build pkg-config autoconf automake libtool curl zip unzip tar \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev libx11-dev libxext-dev libxi-dev libxmu-dev \
            libxkbcommon-dev libvulkan-dev libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0 libarchive-tools p7zip-full

      # Cheap and failure-prone, so it runs before the long steps.
      # Qt comes from download.qt.io through tools/fetch_qt.py (aqtinstall cannot find Qt 6.12 for Windows).
      - name: Restore Qt
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qt
          key: qt-${{ env.QT_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fetch_qt.py') }}

      - name: Install Qt
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" tools/fetch_qt.py --out "$RUNNER_TEMP/qt" --version "$QT_VERSION" --module qtshadertools

      # vcpkg at the exact commit that vcpkg-configuration.json pins as the baseline.
      - name: Set up vcpkg
        run: |
          baseline=$(python3 -c "import json; print(json.load(open('vcpkg-configuration.json'))['default-registry']['baseline'])")
          root="$RUNNER_TEMP/vcpkg"
          cache="$RUNNER_TEMP/vcpkg-cache"
          mkdir -p "$root" "$cache"
          git -C "$root" init -q
          git -C "$root" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$root" fetch -q --depth 1 origin "$baseline"
          git -C "$root" checkout -q FETCH_HEAD
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> "$GITHUB_ENV"
          echo "VCPKG_BASELINE=$baseline" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-x64-linux-dynamic-${{ env.VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**', 'triplets/**') }}
          restore-keys: |
            vcpkg-x64-linux-dynamic-${{ env.VCPKG_BASELINE }}-
            vcpkg-x64-linux-dynamic-

      # Dependencies are built in their own step and cached straight away, so a failure later in the
      # job never costs a second OpenCASCADE build.
      - name: Build dependencies (vcpkg)
        shell: bash
        run: |
          root="$VCPKG_ROOT"
          if [ "$RUNNER_OS" = "Windows" ]; then root=$(cygpath -u "$VCPKG_ROOT"); fi
          "$root/vcpkg" install --triplet x64-linux-dynamic --overlay-triplets=triplets --x-install-root=build/vcpkg_installed

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-x64-linux-dynamic-${{ env.VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**', 'triplets/**') }}

      - name: Configure
        run: cmake --preset linux-clang-asan

      - name: Build
        # -k 0: a failed compile does not stop the others, so one run reports every source that does not build.
        run: cmake --build --preset linux-clang-asan -- -k 0

      # Leak detection is off for now: Qt, Fontconfig and OpenCASCADE keep process-lifetime allocations
      # that LeakSanitizer reports, and no suppression list has been built yet.
      # UBSan checks are built non-recoverable, so they cannot be suppressed at run time; the few third-party
      # header findings that are not RayCAD's are turned off at compile time by cmake/ubsan_ignorelist.txt.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          ASAN_OPTIONS: detect_leaks=0:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        # Every test but those labelled sanitizer-heavy (tests/tiers.cmake: too slow under ASan for the runner).
        run: ctest --preset linux-clang-asan -LE sanitizer-heavy --parallel "$(getconf _NPROCESSORS_ONLN)"
