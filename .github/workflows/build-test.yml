# Configure, build and test on Windows, Linux and macOS (Apple Silicon), each configuration in a job of its own.
# Per push and pull request: Debug and Release with the quick test tier. Nightly (nightly.yml calls this workflow with
# scope nightly): Release with the slow tier, in three jobs per OS, the slow tests (slow), the T-081a naming blocks
# (naming) and the T-081b direct-edit blocks (directedit). Every test runs in exactly one of the two (tests/tiers.cmake
# labels; README, "Which tests to run").
#
# vcpkg binaries are cached with actions/cache on vcpkg's file-based binary cache folder (the old x-gha
# backend is gone). No secret is needed. Qt comes from prebuilt binaries (tools/fetch_qt.py, cached).
# The first run on each OS builds OpenCASCADE from source and is slow; later runs restore it.
# Actions are pinned to commit SHAs; the comment gives the release tag.
name: build-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      scope:
        description: "push (the quick tier) or nightly (the slow tier)"
        type: string
        required: true
      ref:
        description: "The branch, tag or commit to check out (empty: the caller's)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Per scope: a push never waits behind or replaces a nightly run (nightly.yml).
  group: build-test-${{ inputs.scope || 'push' }}-${{ github.ref }}
  # A run on main is allowed to finish so it can fill the dependency cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: "6.12.0"

jobs:
  build-test:
    # Debug and Release are separate jobs that run side by side. In one job, one after the other, they did not fit
    # the time limit on the 4-processor Windows runner (run 45129357124: about 15 minutes of Debug build, over 100
    # of Debug tests, then the Release build and every test still to come at 4 hours).
    # Per push the part is main (the quick tier). The nightly Release is four jobs (part): the slow tier but the
    # naming blocks (slow), the T-081a naming blocks (naming) and the T-081b direct-edit blocks in two (directedit,
    # directedit2), labels naming-blocks, directedit-blocks and directedit-blocks-2 in tests/tiers.cmake. The blocks run
    # one at a time on the 4-processor runner; after everything else in one job they took Windows past the 4-hour limit
    # (run 45646624932: stopped at 114 of 121 tests), and the six direct-edit blocks in one job took Linux past it
    # (nightly 45910746033).
    # Windows is the only platform that gates until the app is finished (PLAN.md section 12, docs/PORTING_DEBT.md): the
    # Linux and macOS jobs still build and test on every push and nightly, as a record, but a failure there does not
    # fail the run (continue-on-error), and their names say so.
    name: ${{ matrix.preset }}-${{ matrix.config }}${{ matrix.part != 'main' && format('-{0}', matrix.part) || '' }}${{ matrix.preset != 'windows-msvc' && ' (not gating)' || '' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.preset != 'windows-msvc' }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-msvc, linux-gcc, macos-arm64]
        config: ${{ fromJSON(inputs.scope == 'nightly' && '["release"]' || '["debug", "release"]') }}
        part: ${{ fromJSON(inputs.scope == 'nightly' && '["slow", "naming", "directedit", "directedit2"]' || '["main"]') }}
        include:
          - preset: windows-msvc
            os: windows-latest
            triplet: x64-windows
            qt_arch: win64_msvc2022_64
          - preset: linux-gcc
            os: ubuntu-latest
            triplet: x64-linux-dynamic
            qt_arch: linux_gcc_64
          - preset: macos-arm64
            os: macos-latest
            triplet: arm64-osx-dynamic
            qt_arch: clang_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # The tests of this job, chosen here rather than by matrix include entries: with the configurations and parts
      # set by scope, an include entry that matches no job of its scope would become a job of its own. Linux and macOS
      # use a test preset (tests/tiers.cmake labels): Debug runs the quick tier less the debug-heavy tests, Release main
      # the quick tier, the nightly parts the slow tier between them; all leave out the label bench (wall-clock budgets
      # set for a developer's machine, which the shared runners do not meet reliably; local runs keep them). Windows
      # also leaves out the window tests (see "Build and test (Windows)"), so it filters by label itself rather than
      # through a test preset (an -LE given with --preset was not combined with the preset's own exclusion): the same
      # selection as on Linux and macOS, less the label desktop. The naming blocks are all in one program: those jobs
      # build only it.
      - name: Select tests
        shell: bash
        run: |
          args=""
          case "${{ matrix.config }}-${{ matrix.part }}" in
            debug-main)
              tests=debug-ci; win='-C Debug -L "^quick$" -LE "^(debug-heavy|bench|desktop)$"' ;;
            release-main)
              tests=release-quick-ci; win='-C Release -L "^quick$" -LE "^(bench|desktop)$"' ;;
            release-slow)
              tests=release-slow-ci; win='-C Release -L "^slow$" -LE "^(bench|desktop|naming-blocks|directedit-blocks|directedit-blocks-2)$"' ;;
            release-naming)
              tests=release-naming-ci; win='-C Release -L "^naming-blocks$" -LE "^(bench|desktop)$"'
              args="--target ray_naming_oracle_tests" ;;
            release-directedit)
              tests=release-directedit-ci; win='-C Release -L "^directedit-blocks$" -LE "^(bench|desktop)$"'
              args="--target ray_naming_oracle_tests" ;;
            release-directedit2)
              tests=release-directedit2-ci; win='-C Release -L "^directedit-blocks-2$" -LE "^(bench|desktop)$"'
              args="--target ray_naming_oracle_tests" ;;
            *) echo "no tests for ${{ matrix.config }}-${{ matrix.part }}"; exit 1 ;;
          esac
          { echo "CI_TESTS=$tests"; echo "CI_WINDOWS_TESTS=$win"; echo "CI_BUILD_ARGS=$args"; } >> "$GITHUB_ENV"
          echo "tests: $tests (Windows: $win) ${args:+build: $args}"

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config autoconf automake libtool curl zip unzip tar \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev libx11-dev libxext-dev libxi-dev libxmu-dev \
            libxkbcommon-dev libvulkan-dev libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0 libarchive-tools p7zip-full

      - name: Install system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config autoconf automake libtool sevenzip

      # Cheap and failure-prone, so it runs before the long steps.
      # Qt comes from download.qt.io through tools/fetch_qt.py (aqtinstall cannot find Qt 6.12 for Windows).
      - name: Restore Qt
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qt
          key: qt-${{ env.QT_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fetch_qt.py') }}

      - name: Install Qt
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" tools/fetch_qt.py --out "$RUNNER_TEMP/qt" --version "$QT_VERSION" --module qtshadertools

      # vcpkg at the exact commit that vcpkg-configuration.json pins as the baseline.
      - name: Set up vcpkg
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          baseline=$("$python" -c "import json; print(json.load(open('vcpkg-configuration.json'))['default-registry']['baseline'])")
          temp="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = "Windows" ]; then temp=$(cygpath -u "$RUNNER_TEMP"); fi
          root="$temp/vcpkg"
          cache="$temp/vcpkg-cache"
          mkdir -p "$root" "$cache"
          git -C "$root" init -q
          git -C "$root" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$root" fetch -q --depth 1 origin "$baseline"
          git -C "$root" checkout -q FETCH_HEAD
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$root/bootstrap-vcpkg.bat" -disableMetrics
            root=$(cygpath -w "$root")
            cache=$(cygpath -w "$cache")
          else
            "$root/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> "$GITHUB_ENV"
          echo "VCPKG_BASELINE=$baseline" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**', 'triplets/**') }}
          restore-keys: |
            vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_BASELINE }}-
            vcpkg-${{ matrix.triplet }}-

      # Dependencies are built in their own step and cached straight away, so a failure later in the
      # job never costs a second OpenCASCADE build.
      - name: Build dependencies (vcpkg)
        shell: bash
        run: |
          root="$VCPKG_ROOT"
          if [ "$RUNNER_OS" = "Windows" ]; then root=$(cygpath -u "$VCPKG_ROOT"); fi
          "$root/vcpkg" install --triplet ${{ matrix.triplet }} --overlay-triplets=triplets --x-install-root=build/vcpkg_installed

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**', 'triplets/**') }}

      # fetch_qt.py exports QT_ROOT_DIR, which the CMake presets read.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call tools\win-env.cmd || exit /b 1
          cmake --preset ${{ matrix.preset }} || exit /b 1

      # The first line shows whether the compiler's default target has FMA: with it, code built without
      # -ffp-contract=off (OpenCASCADE) fuses multiply-adds and its geometry differs in the last bits.
      - name: Configure (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          echo | c++ -dM -E -x c++ - | grep -E '__FMA__|__AVX2__|__x86_64__|__aarch64__' | tr '\n' ' '; echo
          cmake --preset ${{ matrix.preset }}

      # Debug runs the quick test tier, Release the quick tier per push and the slow tier nightly (tests/tiers.cmake).
      # The slow tier is mostly the long randomised naming blocks: in Debug they re-run the code paths the quick tier's
      # naming tests (S4, acceptance, the smoke block) already run there, at many times the cost (an MSVC Debug build
      # cannot finish them in this job), while the nightly Release and AddressSanitizer jobs run them. Debug also leaves
      # out the tests labelled debug-heavy (presets <preset>-debug-ci): the S4 suites, the Release-scale benchmarks
      # and the suites that take 20 minutes or more each in an MSVC Debug build. On the 4-processor runners they took
      # the Debug tests past two hours on Windows and to almost three on Linux (run 45454955286), most of it in the
      # S4 suites, which use more processors than the runner has and so run one at a time. Every Release job runs
      # them. ctest runs one job per processor of the runner; tests with threads of their own take several
      # (PROCESSORS) and timed tests run alone.
      # Windows leaves out the tests that show a window (label desktop): the runner's one screen is smaller than their
      # windows (1440 x 900, up to twice that at 150 % and 200 %), so windows could not be sized as asked and clicks
      # missed; nearly all failed (runs 45129357124, 45454955286). Qt's offscreen platform is no way out on Windows (the
      # gallery and two CAM suites fail on font metrics there). They run locally on every merge (tools\verify.cmd with
      # RAY_TEST_SCREEN). Linux and macOS still run them here, on the offscreen platform with the software scene graph:
      # the gallery, start, palette, settings, measure, sketch, CAM tools and setup sheet suites run; those that need a
      # QRhi (viewport, glass, section, model and most CAM suites) skip, as they say in their output.
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call tools\win-env.cmd || exit /b 1
          cmake --build --preset ${{ matrix.preset }}-${{ matrix.config }} ${{ env.CI_BUILD_ARGS }} || exit /b 1
          ctest --test-dir build/${{ matrix.preset }} ${{ env.CI_WINDOWS_TESTS }} --output-on-failure --timeout 300 --parallel %NUMBER_OF_PROCESSORS% || exit /b 1

      - name: Build (Linux, macOS)
        if: runner.os != 'Windows'
        run: cmake --build --preset ${{ matrix.preset }}-${{ matrix.config }} ${{ env.CI_BUILD_ARGS }}

      # Diagnosis of the naming answers that differ on macOS (temporary): the resolver's and the oracle's answers on the
      # sequences concerned (RAYCAD_NAMING_PROBE, RAYCAD_NAMING_VERBOSE: every element of the baseline and the replay).
      # macOS's OpenCASCADE builds other geometry from the same inputs, so these sequences are judged from this output.
      # In the nightly naming job, whose blocks they come from. Before the tests: after them, a job that had to rebuild
      # its dependencies reached its time limit first (run 45576522199).
      - name: Naming diagnosis (macOS)
        if: runner.os == 'macOS' && matrix.config == 'release' && matrix.part == 'naming'
        continue-on-error: true
        timeout-minutes: 20
        env:
          QT_QPA_PLATFORM: offscreen
          RAYCAD_NAMING_WORKERS: "1"
        run: |
          bin="build/${{ matrix.preset }}/bin/Release/ray_naming_oracle_tests"
          # Settled: holdout6 3:1 (Exact is right) and holdout3 16:1 (another scenario; that case skips). Open: the
          # Repaired answers of 8:18, and the macOS-only answers not judged in 10:2 and the first holdout's 7:7 (their
          # geometry, for the reviewed list).
          for spec in \
            "- 8:18 5EED0000|raycad-synthetic/l_bracket_1.stp #18|edge 104" \
            "- 8:18 5EED0000|raycad-synthetic/l_bracket_1.stp #18|vertex 69" \
            "- 10:2 5EED0000|raycad-synthetic/open_pocket_step_1.stp #2|face 16"; do
            echo "== probe $spec"
            RAYCAD_NAMING_PROBE="$spec" "$bin" "[.naming-probe]" 2>&1 | grep -E "^probe |FAILED|replay failure" || true
          done
          echo "== 8:18 of the main block, verbose"
          RAYCAD_NAMING_ONLY=8:18 RAYCAD_NAMING_VERBOSE=1 "$bin" "[random]" 2>&1 || true
          echo "== 10:2 of the main block, verbose"
          RAYCAD_NAMING_ONLY=10:2 RAYCAD_NAMING_VERBOSE=1 "$bin" "[random]" 2>&1 || true
          echo "== 7:7 of the first holdout, verbose"
          RAYCAD_NAMING_ONLY=7:7 RAYCAD_NAMING_VERBOSE=1 "$bin" "[random-holdout]" 2>&1 || true

      # No display on the runners: the desktop app's smoke test renders with Qt's software backend into
      # the offscreen platform.
      - name: Test (Linux, macOS)
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        # The output is kept for the next step.
        run: |
          set -o pipefail
          ctest --preset ${{ matrix.preset }}-${{ env.CI_TESTS }} --parallel "$(getconf _NPROCESSORS_ONLN)" 2>&1 \
            | tee "$RUNNER_TEMP/ctest.log"

      # A wrong answer of a direct-edit naming block can be judged only from the geometry this runner built (another
      # platform's kernel builds another sequence): for each, the oracle's [.evidence] test replays the sequence here
      # and writes the shapes, elements, scripts and claims (tools/ci_naming_evidence.py), uploaded as an artifact.
      - name: Naming evidence (Linux, macOS)
        if: failure() && runner.os != 'Windows'
        continue-on-error: true
        timeout-minutes: 40
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          [ -f "$RUNNER_TEMP/ctest.log" ] || exit 0
          cfg=Release; [ "${{ matrix.config }}" = debug ] && cfg=Debug
          python3 tools/ci_naming_evidence.py --log "$RUNNER_TEMP/ctest.log" --out evidence \
            --bin "build/${{ matrix.preset }}/bin/$cfg/ray_naming_oracle_tests"

      - name: Upload naming evidence
        if: failure() && runner.os != 'Windows'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: naming-evidence-${{ matrix.preset }}-${{ matrix.config }}-${{ matrix.part }}
          path: evidence
          if-no-files-found: ignore
          retention-days: 30
