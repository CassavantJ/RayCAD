# On-demand replay of single naming sequences on a chosen platform, with everything a review needs: a sequence
# authored on one platform cannot be replayed on another (its kernel builds other geometry), so a macOS answer is
# examined on a macOS runner. Started by hand only (Actions, "probe", Run workflow; or gh workflow run probe.yml).
#
# It builds Release once (the preset and dependency cache of the nightly naming job, build-test.yml), runs each case
# with RAYCAD_NAMING_ONLY and RAYCAD_NAMING_VERBOSE=1 (tools/ci_naming_probe.py), and uploads per case its whole output,
# the shapes before and after with every element, and an [.evidence] folder for each answer of a direct-edit block
# that is wrong, not judged or a conflict. A test that fails does not fail the job: a probe gathers, it judges nothing.
#
# cases: one per line (or separated by ";"): <test executable> <Catch2 filter> <part:seq> [VAR=value ...], such as
#   ray_naming_oracle_tests [random] 2:2 RAYCAD_ORACLE_MUTATE=copy-position,structural-pieces
#   ray_naming_oracle_tests [random-directedit-review1] 17:24
# Actions are pinned to commit SHAs; the comment gives the release tag.
name: probe

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Platform"
        type: choice
        options: [macos, linux, windows]
        default: macos
      ref:
        description: "Branch, tag or commit (empty: the branch chosen above)"
        type: string
        required: false
        default: ""
      cases:
        description: "Cases: <executable> <filter> <part:seq> [VAR=value ...], one per line or ';'-separated"
        type: string
        required: true

permissions:
  contents: read

# Its own group per run: neither a push, a nightly nor another probe cancels it.
concurrency:
  group: probe-${{ github.run_id }}
  cancel-in-progress: false

env:
  QT_VERSION: "6.12.0"

jobs:
  probe:
    name: probe-${{ inputs.os }}
    runs-on: ${{ inputs.os == 'windows' && 'windows-latest' || inputs.os == 'linux' && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 240
    env:
      PRESET: ${{ inputs.os == 'windows' && 'windows-msvc' || inputs.os == 'linux' && 'linux-gcc' || 'macos-arm64' }}
      TRIPLET: ${{ inputs.os == 'windows' && 'x64-windows' || inputs.os == 'linux' && 'x64-linux-dynamic' || 'arm64-osx-dynamic' }}
      CASES: ${{ inputs.cases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # The cases are read before anything is built: a malformed one stops the job at once.
      - name: Read the cases
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          targets=$("$python" tools/ci_naming_probe.py --cases "$CASES" --targets)
          echo "PROBE_TARGETS=$(echo $targets)" >> "$GITHUB_ENV"
          echo "executables to build: $targets"

      # The same setup as build-test.yml.
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config autoconf automake libtool curl zip unzip tar \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev libx11-dev libxext-dev libxi-dev libxmu-dev \
            libxkbcommon-dev libvulkan-dev libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0 libarchive-tools p7zip-full

      - name: Install system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config autoconf automake libtool sevenzip

      - name: Restore Qt
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qt
          key: qt-${{ env.QT_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fetch_qt.py') }}

      - name: Install Qt
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" tools/fetch_qt.py --out "$RUNNER_TEMP/qt" --version "$QT_VERSION" --module qtshadertools

      - name: Set up vcpkg
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          baseline=$("$python" -c "import json; print(json.load(open('vcpkg-configuration.json'))['default-registry']['baseline'])")
          temp="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = "Windows" ]; then temp=$(cygpath -u "$RUNNER_TEMP"); fi
          root="$temp/vcpkg"
          cache="$temp/vcpkg-cache"
          mkdir -p "$root" "$cache"
          git -C "$root" init -q
          git -C "$root" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$root" fetch -q --depth 1 origin "$baseline"
          git -C "$root" checkout -q FETCH_HEAD
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$root/bootstrap-vcpkg.bat" -disableMetrics
            root=$(cygpath -w "$root")
            cache=$(cygpath -w "$cache")
          else
            "$root/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> "$GITHUB_ENV"
          echo "VCPKG_BASELINE=$baseline" >> "$GITHUB_ENV"

      # Only restored: the per-push and nightly jobs keep the cache filled.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ env.TRIPLET }}-${{ env.VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**', 'triplets/**') }}
          restore-keys: |
            vcpkg-${{ env.TRIPLET }}-${{ env.VCPKG_BASELINE }}-
            vcpkg-${{ env.TRIPLET }}-

      - name: Build dependencies (vcpkg)
        shell: bash
        run: |
          root="$VCPKG_ROOT"
          if [ "$RUNNER_OS" = "Windows" ]; then root=$(cygpath -u "$VCPKG_ROOT"); fi
          "$root/vcpkg" install --triplet "$TRIPLET" --overlay-triplets=triplets --x-install-root=build/vcpkg_installed

      - name: Configure and build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call tools\win-env.cmd || exit /b 1
          cmake --preset %PRESET% || exit /b 1
          for %%t in (%PROBE_TARGETS%) do cmake --build --preset %PRESET%-release --target %%t || exit /b 1

      - name: Configure and build (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          cmake --preset "$PRESET"
          for t in $PROBE_TARGETS; do cmake --build --preset "$PRESET-release" --target "$t"; done

      - name: Run the cases
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          python=$(command -v python3 || command -v python)
          if [ "$RUNNER_OS" = "Windows" ]; then
            # The OpenCASCADE DLLs (ctest puts them on PATH for the tests; here the cases run directly).
            export PATH="$(pwd)/build/vcpkg_installed/$TRIPLET/bin:$(cygpath -u "$QT_ROOT_DIR")/bin:$PATH"
          fi
          "$python" tools/ci_naming_probe.py --cases "$CASES" --bindir "build/$PRESET/bin/Release" --out probe

      - name: Upload the probe
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-${{ inputs.os }}-${{ github.run_id }}
          path: probe
          if-no-files-found: warn
          retention-days: 30
